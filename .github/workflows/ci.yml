name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy matplotlib pytest ruff torch --extra-index-url https://download.pytorch.org/whl/cpu
      - run: ruff check --select E9,F .
      - run: python -m pytest -q
